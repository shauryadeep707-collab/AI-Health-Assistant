services:
  - type: web
    name: ai-health-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AI_MODE
        value: demo
      - key: EMERGENCY_NUMBER
        value: "112"
      - key: AMBULANCE_NUMBER
        value: "108"
      - key: PYTHONUNBUFFERED
        value: "1"
