<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation Case Review – AI Health Assistant</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="offline-banner" class="offline-banner">
    ⚠️ You are offline. Advice written offline will be saved and sent to the patient when connection resumes.
  </div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <img src="/assets/logo.svg" alt="Logo" width="30" height="30">
        <span>AI Health Assistant &bull; Case Review</span>
      </a>
      <button class="menu-toggle" onclick="UI.toggleMenu()">☰</button>
      <ul id="nav-links" class="navbar-nav"></ul>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="container" style="max-width: 850px;">
      <div id="consultation-detail">
        <!-- Rendered dynamically by consultations.js -->
        <div class="card p-6 text-center">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-disclaimer">
    ⚠️ Confidential Medical Record: Access restricted to authorized consultation personnel only.
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/offline.js"></script>
  <script src="/js/consultations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Consultations.initDoctorConsultationView();
    });
  </script>
</body>
</html>
