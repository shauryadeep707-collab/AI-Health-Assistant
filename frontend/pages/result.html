<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Result – AI Health Assistant</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="offline-banner" class="offline-banner">
    ⚠️ You are offline. Cached health guidance and emergency contacts remain accessible.
  </div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <img src="/assets/logo.svg" alt="Logo" width="30" height="30">
        <span>AI Health Assistant</span>
      </a>
      <button class="menu-toggle" onclick="UI.toggleMenu()">☰</button>
      <ul id="nav-links" class="navbar-nav"></ul>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="container" style="max-width: 800px;">
      <div id="result-container">
        <!-- Dynamically rendered by result.js -->
        <div class="card p-6 text-center">
          <div class="skeleton skeleton-title" style="margin: 0 auto 1rem auto;"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-disclaimer">
    ⚠️ <strong>Medical Disclaimer:</strong> This algorithm-generated report is intended for preliminary health assessment and educational awareness. It is NOT a definitive diagnosis or medical prescription.
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/offline.js"></script>
  <script src="/js/result.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Result.init();
    });
  </script>
</body>
</html>
